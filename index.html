```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>CODE 39 바코드 검사</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        text-align: center;
    }

    h1 {
        margin: 10px 0 20px;
        font-size: 26px;
    }

    .container {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .row {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
        gap: 10px;
    }

    .label {
        width: 45px;
        font-weight: bold;
        font-size: 18px;
    }

    input {
        flex: 1;
        height: 45px;
        padding: 8px 12px;
        font-size: 18px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: #f8f8f8;
    }

    #status {
        margin: 15px 0;
        padding: 12px;
        border-radius: 8px;
        background: #eee;
        font-size: 17px;
        font-weight: bold;
    }

    #reader {
        width: 100%;
        margin: 15px auto;
        overflow: hidden;
        border-radius: 10px;
    }

    #result {
        margin: 15px 0;
        padding: 18px;
        border-radius: 10px;
        font-size: 28px;
        font-weight: bold;
        min-height: 65px;
    }

    .match {
        background: #d4edda;
        color: #155724;
    }

    .different {
        background: #f8d7da;
        color: #721c24;
    }

    button {
        width: 48%;
        height: 50px;
        margin: 5px 1%;
        border: none;
        border-radius: 8px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    #startBtn {
        background: #007bff;
        color: white;
    }

    #resetBtn {
        background: #6c757d;
        color: white;
    }

    button:disabled {
        opacity: 0.5;
    }

    #debug {
        margin-top: 15px;
        padding: 10px;
        background: #f0f0f0;
        color: #555;
        font-size: 12px;
        text-align: left;
        border-radius: 8px;
        word-break: break-all;
    }
</style>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>

<body>

<div class="container">

    <h1>📦 CODE 39 바코드 검사</h1>

    <div class="row">
        <div class="label">A</div>
        <input type="text" id="barcodeA" readonly>
    </div>

    <div class="row">
        <div class="label">B</div>
        <input type="text" id="barcodeB" readonly>
    </div>

    <div id="status">
        🔵 검사를 시작해주세요.
    </div>

    <div id="reader"></div>

    <div id="result"></div>

    <div>
        <button id="startBtn" onclick="startInspection()">
            검사 시작
        </button>

        <button id="resetBtn" onclick="resetAll()">
            초기화
        </button>
    </div>

    <div id="debug">
        대기 중
    </div>

</div>

<script>

let scanner = null;

let currentTarget = "A";

let processing = false;

let inspectionRunning = false;

let inspectionStopped = false;

let waitingForB = false;


// --------------------------------------------------
// 상태 표시
// --------------------------------------------------

function setStatus(message) {

    document.getElementById("status").textContent = message;

}


// --------------------------------------------------
// 디버그 표시
// --------------------------------------------------

function setDebug(message) {

    document.getElementById("debug").textContent = message;

}


// --------------------------------------------------
// 검사 시작
// --------------------------------------------------

async function startInspection() {

    if (inspectionRunning) {
        return;
    }

    inspectionRunning = true;
    inspectionStopped = false;

    currentTarget = "A";
    processing = false;
    waitingForB = false;

    document.getElementById("barcodeA").value = "";
    document.getElementById("barcodeB").value = "";

    document.getElementById("result").textContent = "";
    document.getElementById("result").className = "";

    document.getElementById("startBtn").disabled = true;

    setStatus("🟡 A 바코드를 스캔하세요.");
    setDebug("카메라 시작 중...");

    scanner = new Html5Qrcode("reader");

    try {

        await scanner.start(
            {
                facingMode: "environment"
            },
            {
                fps: 20,

                qrbox: {
                    width: 380,
                    height: 120
                },

                formatsToSupport: [
                    Html5QrcodeSupportedFormats.CODE_39
                ]
            },
            onScanSuccess,
            onScanFailure
        );

        setDebug("카메라 작동 중 / CODE 39 대기");

        // 카메라가 실제로 생성된 후 자동초점 시도
        setTimeout(tryContinuousFocus, 300);

    } catch (error) {

        console.error(error);

        inspectionRunning = false;

        document.getElementById("startBtn").disabled = false;

        setStatus("❌ 카메라를 시작할 수 없습니다.");

        setDebug(
            "카메라 오류: " + error
        );
    }

}


// --------------------------------------------------
// 연속 자동초점 시도
// --------------------------------------------------

function tryContinuousFocus() {

    try {

        const video = document.querySelector("#reader video");

        if (!video) {
            setDebug("카메라 작동 중 / 자동초점 설정 미지원");
            return;
        }

        if (!video.srcObject) {
            setDebug("카메라 작동 중 / 자동초점 설정 미지원");
            return;
        }

        const tracks = video.srcObject.getVideoTracks();

        if (!tracks || tracks.length === 0) {
            return;
        }

        const track = tracks[0];

        if (!track.getCapabilities) {
            setDebug("카메라 작동 중 / 자동초점 설정 미지원");
            return;
        }

        const capabilities = track.getCapabilities();

        if (
            capabilities.focusMode &&
            capabilities.focusMode.includes("continuous")
        ) {

            track.applyConstraints({
                advanced: [
                    {
                        focusMode: "continuous"
                    }
                ]
            })
            .then(function() {

                setDebug(
                    "카메라 작동 중 / 연속 자동초점 활성화"
                );

            })
            .catch(function(error) {

                console.log(
                    "자동초점 설정 실패:",
                    error
                );

                setDebug(
                    "카메라 작동 중 / 기본 자동초점 사용"
                );

            });

        } else {

            setDebug(
                "카메라 작동 중 / 기본 자동초점 사용"
            );

        }

    } catch (error) {

        console.log(
            "자동초점 확인 오류:",
            error
        );

    }

}


// --------------------------------------------------
// 바코드 스캔 성공
// --------------------------------------------------

function onScanSuccess(decodedText, decodedResult) {

    if (!inspectionRunning) {
        return;
    }

    if (inspectionStopped) {
        return;
    }

    if (waitingForB) {
        return;
    }

    if (processing) {
        return;
    }

    processing = true;

    const barcode = decodedText.trim();

    setDebug(
        "인식: " + barcode
    );


    // --------------------------------------------------
    // A 바코드
    // --------------------------------------------------

    if (currentTarget === "A") {

        document.getElementById("barcodeA").value = barcode;

        setStatus("✅ A 완료");

        currentTarget = "B";

        waitingForB = true;

        setDebug(
            "A 인식 완료 / 2초 후 B 스캔 시작"
        );


        // A 스캔 후 2초 대기
        setTimeout(function() {

            if (!inspectionRunning || inspectionStopped) {
                return;
            }

            waitingForB = false;

            processing = false;

            setStatus(
                "🟡 B 바코드를 스캔하세요."
            );

            setDebug(
                "B 바코드 스캔 대기"
            );

        }, 2000);

    }


    // --------------------------------------------------
    // B 바코드
    // --------------------------------------------------

    else if (currentTarget === "B") {

        document.getElementById("barcodeB").value = barcode;

        setStatus("✅ B 완료");

        setDebug(
            "A / B 비교 중..."
        );

        setTimeout(function() {

            compareBarcode();

        }, 200);

    }

}


// --------------------------------------------------
// 스캔 실패
// --------------------------------------------------

function onScanFailure(error) {

    // 정상적인 스캔 대기 상태에서는
    // 오류 메시지를 표시하지 않음

}


// --------------------------------------------------
// A / B 비교
// --------------------------------------------------

function compareBarcode() {

    const a =
        document.getElementById("barcodeA").value;

    const b =
        document.getElementById("barcodeB").value;


    if (a === b) {

        // ----------------------------------------------
        // 일치
        // ----------------------------------------------

        document.getElementById("result").textContent =
            "✓ 일치";

        document.getElementById("result").className =
            "match";

        setStatus(
            "🟢 일치"
        );

        setDebug(
            "A와 B가 일치합니다. 1초 후 다음 검사."
        );


        setTimeout(function() {

            nextInspection();

        }, 1000);

    } else {

        // ----------------------------------------------
        // 불일치
        // ----------------------------------------------

        inspectionStopped = true;

        inspectionRunning = false;

        processing = true;

        document.getElementById("result").textContent =
            "✕ 불일치";

        document.getElementById("result").className =
            "different";

        setStatus(
            "🔴 불일치 - 검사 중지"
        );

        setDebug(
            "A: " + a +
            " / B: " + b +
            " / 초기화 버튼을 눌러주세요."
        );

    }

}


// --------------------------------------------------
// 다음 검사
// --------------------------------------------------

function nextInspection() {

    if (inspectionStopped) {
        return;
    }

    document.getElementById("barcodeA").value = "";

    document.getElementById("barcodeB").value = "";

    document.getElementById("result").textContent = "";

    document.getElementById("result").className = "";

    currentTarget = "A";

    processing = false;

    waitingForB = false;

    inspectionRunning = true;

    setStatus(
        "🟡 A 바코드를 스캔하세요."
    );

    setDebug(
        "다음 검사 대기"
    );

}


// --------------------------------------------------
// 초기화
// --------------------------------------------------

async function resetAll() {

    inspectionRunning = false;

    inspectionStopped = false;

    processing = false;

    waitingForB = false;

    currentTarget = "A";


    if (scanner) {

        try {

            await scanner.stop();

        } catch (error) {

            console.log(
                "카메라 정지 오류:",
                error
            );

        }

        try {

            scanner.clear();

        } catch (error) {

            console.log(
                "스캐너 초기화 오류:",
                error
            );

        }

        scanner = null;

    }


    document.getElementById("barcodeA").value = "";

    document.getElementById("barcodeB").value = "";

    document.getElementById("result").textContent = "";

    document.getElementById("result").className = "";

    document.getElementById("startBtn").disabled = false;

    setStatus(
        "🔵 검사를 시작해주세요."
    );

    setDebug(
        "대기 중"
    );

}

</script>

</body>
</html>
