<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바코드 비교</title>

```
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        text-align: center;
    }

    h1 {
        margin: 5px 0 20px 0;
        font-size: 28px;
    }

    .container {
        max-width: 500px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 3px 15px rgba(0,0,0,0.15);
    }

    select,
    button {
        width: 100%;
        height: 50px;
        margin-top: 10px;
        font-size: 18px;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    button {
        background: #333;
        color: white;
        border: none;
        cursor: pointer;
    }

    button:disabled {
        background: #aaa;
    }

    #reader {
        width: 100%;
        margin-top: 20px;
    }

    .step {
        margin-top: 20px;
        font-size: 22px;
        font-weight: bold;
    }

    .value {
        margin-top: 10px;
        min-height: 45px;
        padding: 10px;
        background: #eee;
        border-radius: 8px;
        font-size: 20px;
        word-break: break-all;
    }

    #result {
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        font-size: 28px;
        font-weight: bold;
        min-height: 65px;
    }

    .waiting {
        background: #eee;
        color: #555;
    }

    .match {
        background: #d4edda;
        color: #198754;
    }

    .mismatch {
        background: #f8d7da;
        color: #dc3545;
    }

    .info {
        margin-top: 15px;
        font-size: 15px;
        color: #666;
    }
</style>
```

</head>

<body>

<div class="container">

```
<h1>바코드 비교</h1>

<select id="barcodeType">
    <option value="CODE_39">CODE 39</option>
    <option value="QR_CODE">QR CODE</option>
</select>

<button id="startButton" onclick="startScan()">스캔 시작</button>
<button id="resetButton" onclick="resetScan()" disabled>초기화</button>

<div class="step" id="step">
    A 바코드를 스캔하세요
</div>

<div id="reader"></div>

<div class="value">
    <strong>A :</strong>
    <span id="valueA">-</span>
</div>

<div class="value">
    <strong>B :</strong>
    <span id="valueB">-</span>
</div>

<div id="result" class="waiting">
    대기 중
</div>

<div class="info" id="info">
    A = CODE 39<br>
    B = QR CODE
</div>
```

</div>

<script>

    let html5QrCode = null;

    // 현재 단계
    // A = CODE 39
    // B = QR CODE
    let scanStep = "A";

    let valueA = "";
    let valueB = "";

    let isScanning = false;
    let isProcessing = false;


    // ----------------------------------------
    // 바코드 형식
    // ----------------------------------------

    function getFormat(formatName) {

        if (formatName === "CODE_39") {
            return Html5QrcodeSupportedFormats.CODE_39;
        }

        if (formatName === "QR_CODE") {
            return Html5QrcodeSupportedFormats.QR_CODE;
        }

        return Html5QrcodeSupportedFormats.CODE_39;
    }


    // ----------------------------------------
    // 스캔 시작
    // ----------------------------------------

    async function startScan() {

        if (isScanning) {
            return;
        }

        resetValues();

        scanStep = "A";
        isProcessing = false;

        document.getElementById("step").innerText =
            "A 바코드를 스캔하세요";

        document.getElementById("result").innerText =
            "A 스캔 대기 중";

        document.getElementById("result").className =
            "waiting";

        document.getElementById("barcodeType").disabled = true;
        document.getElementById("startButton").disabled = true;
        document.getElementById("resetButton").disabled = false;

        html5QrCode = new Html5Qrcode("reader");

        try {

            await html5QrCode.start(

                {
                    facingMode: "environment"
                },

                {
                    fps: 20,

                    qrbox: {
                        width: 300,
                        height: 100
                    },

                    formatsToSupport: [
                        getFormat("CODE_39")
                    ]
                },

                onScanSuccess,

                onScanFailure
            );

            isScanning = true;

            // 자동 초점 요청
            requestAutoFocus();

        } catch (err) {

            console.error(err);

            alert(
                "카메라를 실행할 수 없습니다.\n\n" +
                "카메라 권한을 확인해주세요."
            );

            document.getElementById("barcodeType").disabled = false;
            document.getElementById("startButton").disabled = false;
            document.getElementById("resetButton").disabled = true;

            html5QrCode = null;
        }
    }


    // ----------------------------------------
    // 스캔 성공
    // ----------------------------------------

    async function onScanSuccess(decodedText, decodedResult) {

        if (isProcessing) {
            return;
        }

        isProcessing = true;

        console.log("인식값 :", decodedText);

        if (scanStep === "A") {

            valueA = decodedText;

            document.getElementById("valueA").innerText =
                valueA;

            document.getElementById("step").innerText =
                "A 인식 완료";

            document.getElementById("result").innerText =
                "A 인식 완료";

            document.getElementById("result").className =
                "waiting";

            // 카메라 정지
            await stopScanner();

            // 2초 후 B 스캔
            setTimeout(function () {

                startBScan();

            }, 2000);

        }

        else if (scanStep === "B") {

            valueB = decodedText;

            document.getElementById("valueB").innerText =
                valueB;

            await stopScanner();

            compareValues();
        }
    }


    // ----------------------------------------
    // A → B 전환
    // ----------------------------------------

    async function startBScan() {

        scanStep = "B";
        isProcessing = false;

        document.getElementById("step").innerText =
            "B QR CODE를 스캔하세요";

        document.getElementById("result").innerText =
            "B QR CODE 스캔 대기 중";

        document.getElementById("result").className =
            "waiting";

        html5QrCode = new Html5Qrcode("reader");

        try {

            await html5QrCode.start(

                {
                    facingMode: "environment"
                },

                {
                    fps: 20,

                    qrbox: {
                        width: 250,
                        height: 250
                    },

                    formatsToSupport: [
                        getFormat("QR_CODE")
                    ]
                },

                onScanSuccess,

                onScanFailure
            );

            isScanning = true;

            requestAutoFocus();

        } catch (err) {

            console.error(err);

            alert(
                "B QR CODE 카메라를 실행할 수 없습니다."
            );

            document.getElementById("startButton").disabled =
                false;

            document.getElementById("barcodeType").disabled =
                false;
        }
    }


    // ----------------------------------------
    // A와 B 비교
    // ----------------------------------------

    function compareValues() {

        if (valueA === valueB) {

            document.getElementById("step").innerText =
                "비교 완료";

            document.getElementById("result").innerText =
                "✓ 일치";

            document.getElementById("result").className =
                "match";

            // 1초 후 다음 비교 준비
            setTimeout(function () {

                resetScan();

            }, 1000);

        }

        else {

            document.getElementById("step").innerText =
                "비교 완료";

            document.getElementById("result").innerText =
                "✕ 불일치";

            document.getElementById("result").className =
                "mismatch";

            // 불일치하면 자동으로 다음으로 넘어가지 않음
            document.getElementById("startButton").disabled =
                false;
        }
    }


    // ----------------------------------------
    // 스캐너 정지
    // ----------------------------------------

    async function stopScanner() {

        if (html5QrCode) {

            try {

                if (isScanning) {
                    await html5QrCode.stop();
                }

            } catch (err) {

                console.log("카메라 정지:", err);

            }

            try {

                html5QrCode.clear();

            } catch (err) {

                console.log("clear:", err);

            }

            html5QrCode = null;
        }

        isScanning = false;
    }


    // ----------------------------------------
    // 초기화
    // ----------------------------------------

    async function resetScan() {

        await stopScanner();

        scanStep = "A";
        valueA = "";
        valueB = "";
        isProcessing = false;

        document.getElementById("valueA").innerText = "-";
        document.getElementById("valueB").innerText = "-";

        document.getElementById("step").innerText =
            "A 바코드를 스캔하세요";

        document.getElementById("result").innerText =
            "대기 중";

        document.getElementById("result").className =
            "waiting";

        document.getElementById("barcodeType").disabled =
            false;

        document.getElementById("startButton").disabled =
            false;

        document.getElementById("resetButton").disabled =
            true;
    }


    // ----------------------------------------
    // 값 초기화
    // ----------------------------------------

    function resetValues() {

        valueA = "";
        valueB = "";

        document.getElementById("valueA").innerText = "-";
        document.getElementById("valueB").innerText = "-";
    }


    // ----------------------------------------
    // 스캔 실패
    // ----------------------------------------

    function onScanFailure(error) {

        // 정상적으로 계속 발생하는 메시지이므로
        // 화면에는 표시하지 않음

    }


    // ----------------------------------------
    // 자동 초점
    // ----------------------------------------

    function requestAutoFocus() {

        setTimeout(function () {

            try {

                const video =
                    document.querySelector("#reader video");

                if (
                    video &&
                    video.srcObject &&
                    video.srcObject.getVideoTracks().length > 0
                ) {

                    const track =
                        video.srcObject.getVideoTracks()[0];

                    const capabilities =
                        track.getCapabilities();

                    if (
                        capabilities.focusMode &&
                        capabilities.focusMode.includes("continuous")
                    ) {

                        track.applyConstraints({
                            advanced: [
                                {
                                    focusMode: "continuous"
                                }
                            ]
                        }).catch(function (err) {
                            console.log("자동초점 설정 실패:", err);
                        });
                    }
                }

            } catch (err) {

                console.log("자동초점 오류:", err);

            }

        }, 500);
    }

</script>

</body>
</html>
