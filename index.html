<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>바코드 검사</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    text-align: center;
}

.container {
    max-width: 600px;
    margin: 0 auto;
    background: white;
    padding: 18px;
    border-radius: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

h1 {
    margin: 5px 0 20px;

}


/* ==========================================
   바코드 종류

    margin-bottom: 15px;
    text-align: left;
}

.format-label {
    display: block;
    margin-bottom: 7px;

    font-weight: bold;
}

#formatSelect {

    height: 48px;
    padding: 5px 10px;
    font-size: 17px;

    background: white;
}

   A / B
========================================== */

    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.label {
    width: 35px;
    font-size: 18px;
    font-weight: bold;
}

input {
    flex: 1;

    padding: 8px 12px;

}

    font-weight: bold;
}

========================================== */

#reader {
    width: 100%;
    margin: 15px auto;
    overflow: hidden;
    border-radius: 10px;

}


/*
   카메라 영상
*/

#reader video {
    width: 100% !important;
    height: auto !important;

/*

/* ==========================================

#debug {

}

<script

<body>


<div class="container">


<h1>📦 바코드 검사</h1>


<!-- ==========================================
     바코드 종류
========================================== -->

<div class="format-area">

    <label class="format-label">
        바코드 종류
    </label>

    <select id="formatSelect">

        <option value="CODE_39">
            CODE 39
        </option>

        <option value="CODE_128">
            CODE 128
        </option>

        <option value="QR_CODE">
            QR CODE
        </option>

        <option value="DATA_MATRIX">
            Data Matrix
        </option>

    </select>

</div>


<!-- ==========================================
     A
========================================== -->

<div class="row">

    <div class="label">
        A
    </div>

    <input
        type="text"
        id="barcodeA"
        readonly
    >

</div>


<!-- ==========================================
     B
========================================== -->

<div class="row">

    <div class="label">
        B
    </div>

    <input
        type="text"
        id="barcodeB"
        readonly
    >

</div>


<!-- ==========================================
     상태
========================================== -->

<div id="status">

    🔵 검사할 바코드 종류를 선택하고 검사를 시작하세요.

</div>


<!-- ==========================================
     카메라
========================================== -->

<div id="reader"></div>


<div class="guide-text">

    초록색 인식 영역 안에 바코드를 맞춰주세요.

</div>


<!-- ==========================================
     결과
========================================== -->

<div id="result"></div>


<!-- ==========================================
     버튼
========================================== -->

<div class="button-area">

    <button
        id="startBtn"
        onclick="startInspection()">

        검사 시작

    </button>


    <button
        id="resetBtn"
        onclick="resetAll()">

        초기화

    </button>

</div>


<!-- ==========================================
     디버그
========================================== -->

<div id="debug">

    대기 중

</div>


</div>


<script>


/* ==================================================
   전역 변수
================================================== */

let scanner = null;

let currentTarget = "A";

let processing = false;

let inspectionRunning = false;

let inspectionStopped = false;

let waitingForB = false;


/* ==================================================
   바코드 종류 이름
================================================== */

function getFormatName() {

    const format =
        document.getElementById("formatSelect").value;


    if (format === "CODE_39") {

        return "CODE 39";

    }


    if (format === "CODE_128") {

        return "CODE 128";

    }


    if (format === "QR_CODE") {

        return "QR CODE";

    }


    if (format === "DATA_MATRIX") {

        return "Data Matrix";

    }


    return format;

}


/* ==================================================
   바코드 형식
================================================== */

function getSelectedFormat() {

    const format =
        document.getElementById("formatSelect").value;


    if (format === "CODE_39") {

        return Html5QrcodeSupportedFormats.CODE_39;

    }


    if (format === "CODE_128") {

        return Html5QrcodeSupportedFormats.CODE_128;

    }


    if (format === "QR_CODE") {

        return Html5QrcodeSupportedFormats.QR_CODE;

    }


    if (format === "DATA_MATRIX") {

        return Html5QrcodeSupportedFormats.DATA_MATRIX;

    }


    return Html5QrcodeSupportedFormats.CODE_39;

}


/* ==================================================
   인식 영역
================================================== */

function getScanArea() {


    const format =
        document.getElementById("formatSelect").value;


    /*
       ----------------------------------------------
       CODE 39 / CODE 128
       ----------------------------------------------
    */

    if (
        format === "CODE_39" ||
        format === "CODE_128"
    ) {


        return {

            width: 300,

            height: 100

        };

    }


    /*
       ----------------------------------------------
       QR / Data Matrix
       ----------------------------------------------
    */

    return {

        width: 250,

        height: 250

    };

}


/* ==================================================
   상태
================================================== */

function setStatus(message) {

    document
        .getElementById("status")
        .textContent = message;

}


/* ==================================================
   디버그
================================================== */

function setDebug(message) {

    document
        .getElementById("debug")
        .textContent = message;

}


/* ==================================================
   바코드 종류 변경
================================================== */

document
    .getElementById("formatSelect")
    .addEventListener(
        "change",
        function() {


            if (inspectionRunning) {

                return;

            }


            const name =
                getFormatName();


            setStatus(
                "🔵 " +
                name +
                " 선택됨. 검사를 시작하세요."
            );


            setDebug(
                "선택 형식: " +
                name
            );

        }
    );


/* ==================================================
   검사 시작
================================================== */

async function startInspection() {


    if (inspectionRunning) {

        return;

    }


    inspectionRunning = true;

    inspectionStopped = false;

    currentTarget = "A";

    processing = false;

    waitingForB = false;


    document
        .getElementById("barcodeA")
        .value = "";


    document
        .getElementById("barcodeB")
        .value = "";


    document
        .getElementById("result")
        .textContent = "";


    document
        .getElementById("result")
        .className = "";


    document
        .getElementById("formatSelect")
        .disabled = true;


    document
        .getElementById("startBtn")
        .disabled = true;


    const formatName =
        getFormatName();


    const scanArea =
        getScanArea();


    setStatus(
        "🟡 A 바코드를 스캔하세요."
    );


    setDebug(
        formatName +
        " / 인식영역 " +
        scanArea.width +
        " × " +
        scanArea.height +
        " / 카메라 시작 중..."
    );


    scanner =
        new Html5Qrcode("reader");


    try {


        /*
           ==========================================
           카메라 시작
           ==========================================

           중요:
           기존 정상 작동 방식 유지
        */

        await scanner.start(

            {
                facingMode: "environment"
            },


            {

                /*
                   초당 인식 횟수
                */

                fps: 20,


                /*
                   실제 인식 영역
                */

                qrbox: scanArea,


                /*
                   선택한 바코드만 인식
                */

                formatsToSupport: [

                    getSelectedFormat()

                ]

            },


            onScanSuccess,

            onScanFailure

        );


        /*
           카메라 시작 성공
        */

        setDebug(
            formatName +
            " / 인식영역 " +
            scanArea.width +
            " × " +
            scanArea.height +
            " / 카메라 작동 중"
        );


        /*
           초점 개선 시작

           카메라가 완전히 시작된 뒤 실행
        */

        startFocusOptimization();


    } catch (error) {


        console.error(
            "카메라 시작 오류:",
            error
        );


        inspectionRunning = false;


        document
            .getElementById("formatSelect")
            .disabled = false;


        document
            .getElementById("startBtn")
            .disabled = false;


        setStatus(
            "❌ 카메라를 시작할 수 없습니다."
        );


        setDebug(
            "카메라 오류: " +
            error.name +
            " / " +
            error.message
        );

    }

}


/* ==================================================
   초점 최적화 시작
================================================== */

function startFocusOptimization() {


    /*
       즉시 1회
    */

    applyBestFocus();


    /*
       300ms 후
    */

    setTimeout(
        function() {

            applyBestFocus();

        },
        300
    );


    /*
       800ms 후
    */

    setTimeout(
        function() {

            applyBestFocus();

        },
        800
    );


    /*
       1500ms 후
    */

    setTimeout(
        function() {

            applyBestFocus();

        },
        1500
    );

}


/* ==================================================
   최적 초점 설정
================================================== */

async function applyBestFocus() {


    try {


        /*
           현재 카메라 영상
        */

        const video =
            document.querySelector(
                "#reader video"
            );


        if (!video) {

            return;

        }


        if (!video.srcObject) {

            return;

        }


        const tracks =
            video.srcObject.getVideoTracks();


        if (
            !tracks ||
            tracks.length === 0
        ) {

            return;

        }


        const track =
            tracks[0];


        /*
           카메라 capability가 없는
           브라우저도 존재함
        */

        if (!track.getCapabilities) {

            setDebug(
                getFormatName() +
                " / 카메라 기본 자동초점 사용"
            );

            return;

        }


        const capabilities =
            track.getCapabilities();


        /*
           ==========================================
           1단계
           연속 자동초점
           ==========================================
        */

        if (
            capabilities.focusMode &&
            capabilities.focusMode.includes(
                "continuous"
            )
        ) {


            try {


                await track.applyConstraints({

                    advanced: [

                        {
                            focusMode:
                                "continuous"
                        }

                    ]

                });


                setDebug(
                    getFormatName() +
                    " / 연속 자동초점 활성화"
                );


                return;

            } catch (error) {


                console.log(
                    "continuous focus 실패:",
                    error
                );

            }

        }


        /*
           ==========================================
           2단계
           single-shot focus
           ==========================================
        */

        if (
            capabilities.focusMode &&
            capabilities.focusMode.includes(
                "single-shot"
            )
        ) {


            try {


                await track.applyConstraints({

                    advanced: [

                        {
                            focusMode:
                                "single-shot"
                        }

                    ]

                });


                setDebug(
                    getFormatName() +
                    " / 자동초점 실행"
                );


                return;

            } catch (error) {


                console.log(
                    "single-shot focus 실패:",
                    error
                );

            }

        }


        /*
           ==========================================
           3단계
           focusDistance
           ==========================================

           지원하는 카메라에서만 사용
        */

        if (
            capabilities.focusDistance &&
            capabilities.focusDistance.min !== undefined &&
            capabilities.focusDistance.max !== undefined
        ) {


            try {


                /*
                   가까운 바코드 검사에 적합하도록
                   focusDistance 범위를 계산

                   min쪽이 가까운 초점인 카메라가
                   일반적이지만 기기마다 다를 수 있어
                   아주 공격적으로 설정하지 않음.
                */

                const min =
                    capabilities.focusDistance.min;


                const max =
                    capabilities.focusDistance.max;


                const distance =
                    min +
                    (
                        (max - min) *
                        0.20
                    );


                await track.applyConstraints({

                    advanced: [

                        {
                            focusDistance:
                                distance
                        }

                    ]

                });


                setDebug(
                    getFormatName() +
                    " / 근거리 초점 적용"
                );


            } catch (error) {


                console.log(
                    "focusDistance 실패:",
                    error
                );


                setDebug(
                    getFormatName() +
                    " / 카메라 기본 자동초점 사용"
                );

            }

        } else {


            setDebug(
                getFormatName() +
                " / 카메라 기본 자동초점 사용"
            );

        }


    } catch (error) {


        console.log(
            "초점 최적화 오류:",
            error
        );

    }

}


/* ==================================================
   바코드 인식 성공
================================================== */

function onScanSuccess(
    decodedText,
    decodedResult
) {


    if (!inspectionRunning) {

        return;

    }


    if (inspectionStopped) {

        return;

    }


    if (waitingForB) {

        return;

    }


    if (processing) {

        return;

    }


    processing = true;


    const barcode =
        decodedText.trim();


    setDebug(
        getFormatName() +
        " / 인식: " +
        barcode
    );


    /* ==========================================
       A
    ========================================== */

    if (currentTarget === "A") {


        document
            .getElementById("barcodeA")
            .value = barcode;


        setStatus(
            "✅ A 완료"
        );


        currentTarget = "B";


        waitingForB = true;


        setDebug(
            getFormatName() +
            " / A 인식 완료 / 2초 후 B 스캔"
        );


        setTimeout(
            function() {


                if (
                    !inspectionRunning ||
                    inspectionStopped
                ) {

                    return;

                }


                waitingForB = false;

                processing = false;


                setStatus(
                    "🟡 B 바코드를 스캔하세요."
                );


                setDebug(
                    getFormatName() +
                    " / B 바코드 스캔 대기"
                );


            },
            2000
        );

    }


    /* ==========================================
       B
    ========================================== */

    else if (currentTarget === "B") {


        document
            .getElementById("barcodeB")
            .value = barcode;


        setStatus(
            "✅ B 완료"
        );


        setDebug(
            getFormatName() +
            " / A와 B 비교 중..."
        );


        setTimeout(
            function() {

                compareBarcode();

            },
            200
        );

    }

}


/* ==================================================
   스캔 실패
================================================== */

function onScanFailure(error) {

}


/* ==================================================
   A / B 비교
================================================== */

function compareBarcode() {


    const a =
        document
            .getElementById("barcodeA")
            .value;


    const b =
        document
            .getElementById("barcodeB")
            .value;


    if (a === b) {


        /*
           일치
        */

        document
            .getElementById("result")
            .textContent =
                "✓ 일치";


        document
            .getElementById("result")
            .className =
                "match";


        setStatus(
            "🟢 일치"
        );


        setDebug(
            "A와 B가 일치합니다. " +
            "1초 후 다음 검사."
        );


        setTimeout(
            function() {

                nextInspection();

            },
            1000
        );


    } else {


        /*
           불일치
        */

        inspectionStopped = true;

        inspectionRunning = false;

        processing = true;


        document
            .getElementById("result")
            .textContent =
                "✕ 불일치";


        document
            .getElementById("result")
            .className =
                "different";


        setStatus(
            "🔴 불일치 - 검사 중지"
        );


        setDebug(
            "A: " +
            a +
            " / B: " +
            b +
            " / 초기화 버튼을 눌러주세요."
        );

    }

}


/* ==================================================
   다음 검사
================================================== */

function nextInspection() {


    if (inspectionStopped) {

        return;

    }


    document
        .getElementById("barcodeA")
        .value = "";


    document
        .getElementById("barcodeB")
        .value = "";


    document
        .getElementById("result")
        .textContent = "";


    document
        .getElementById("result")
        .className = "";


    currentTarget = "A";

    processing = false;

    waitingForB = false;

    inspectionRunning = true;


    setStatus(
        "🟡 A 바코드를 스캔하세요."
    );


    setDebug(
        getFormatName() +
        " / 다음 A 바코드 대기"
    );


}


/* ==================================================
   초기화
================================================== */

async function resetAll() {


    inspectionRunning = false;

    inspectionStopped = false;

    processing = false;

    waitingForB = false;

    currentTarget = "A";


    if (scanner) {


        try {

            await scanner.stop();

        } catch (error) {

            console.log(
                "카메라 정지 오류:",
                error
            );

        }


        try {

            scanner.clear();

        } catch (error) {

            console.log(
                "스캐너 clear 오류:",
                error
            );

        }


        scanner = null;

    }


    document
        .getElementById("barcodeA")
        .value = "";


    document
        .getElementById("barcodeB")
        .value = "";


    document
        .getElementById("result")
        .textContent = "";


    document
        .getElementById("result")
        .className = "";


    document
        .getElementById("formatSelect")
        .disabled = false;


    document
        .getElementById("startBtn")
        .disabled = false;


    setStatus(
        "🔵 검사할 바코드 종류를 선택하고 검사를 시작하세요."
    );


    setDebug(
        "대기 중"
    );

}

</script>

</body>

</html>
