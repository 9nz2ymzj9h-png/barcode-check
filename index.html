<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;

<script

<body>


<div class="container">


<h1>📦 바코드 검사</h1>


<!-- ==========================================
     바코드 종류
========================================== -->

<div class="format-area">

    <label class="format-label">
        바코드 종류
    </label>

    <select id="formatSelect">

        <option value="CODE_39">
            CODE 39
        </option>

        <option value="CODE_128">
            CODE 128
        </option>

        <option value="QR_CODE">
            QR CODE
        </option>

        <option value="DATA_MATRIX">
            Data Matrix
        </option>

    </select>

</div>


<!-- ==========================================
     A
========================================== -->

<div class="row">

    <div class="label">
        A
    </div>

    <input
        type="text"
        id="barcodeA"
        readonly
    >

</div>


<!-- ==========================================
     B
========================================== -->

<div class="row">

    <div class="label">
        B
    </div>

    <input
        type="text"
        id="barcodeB"
        readonly
    >

</div>


<!-- ==========================================
     상태
========================================== -->

<div id="status">

    🔵 검사할 바코드 종류를 선택하고 검사를 시작하세요.

</div>


<!-- ==========================================
     카메라
========================================== -->

<div id="reader"></div>


<div class="guide-text">

    초록색 인식 영역 안에 바코드를 맞춰주세요.

</div>


<!-- ==========================================
     결과
========================================== -->

<div id="result"></div>


<!-- ==========================================
     버튼
========================================== -->

<div class="button-area">

    <button
        id="startBtn"
        onclick="startInspection()">

        검사 시작

    </button>


    <button
        id="resetBtn"
        onclick="resetAll()">

        초기화

    </button>

</div>


<!-- ==========================================
     디버그
========================================== -->

<div id="debug">

    대기 중

</div>


</div>


<script>


/* ==================================================
   전역 변수
================================================== */

let scanner = null;

let currentTarget = "A";

let processing = false;

let inspectionRunning = false;

let inspectionStopped = false;

let waitingForB = false;


/*
   CODE 128 연속 인식 검증용
*/

let code128Candidate = "";

let code128Count = 0;

let code128LastTime = 0;


/*
   CODE 128에서 같은 값이
   몇 번 연속 나와야 인정할지
*/

const CODE128_REQUIRED_COUNT = 3;


/*
   CODE 128 연속 인식 허용 시간

   너무 오래 지난 인식은
   같은 값이어도 다시 시작
*/

const CODE128_MAX_INTERVAL = 800;


/* ==================================================
   바코드 종류 이름
================================================== */

function getFormatName() {

    const format =
        document.getElementById("formatSelect").value;


    if (format === "CODE_39") {

        return "CODE 39";

    }


    if (format === "CODE_128") {

        return "CODE 128";

    }


    if (format === "QR_CODE") {

        return "QR CODE";

    }


    if (format === "DATA_MATRIX") {

        return "Data Matrix";

    }


    return format;

}


/* ==================================================
   바코드 형식
================================================== */

function getSelectedFormat() {

    const format =
        document.getElementById("formatSelect").value;


    if (format === "CODE_39") {

        return Html5QrcodeSupportedFormats.CODE_39;

    }


    if (format === "CODE_128") {

        return Html5QrcodeSupportedFormats.CODE_128;

    }


    if (format === "QR_CODE") {

        return Html5QrcodeSupportedFormats.QR_CODE;

    }


    if (format === "DATA_MATRIX") {

        return Html5QrcodeSupportedFormats.DATA_MATRIX;

    }


    return Html5QrcodeSupportedFormats.CODE_39;

}


/* ==================================================
   인식 영역
================================================== */

function getScanArea() {


    const format =
        document.getElementById("formatSelect").value;


    /*
       CODE 39 / CODE 128
    */

    if (
        format === "CODE_39" ||
        format === "CODE_128"
    ) {

        return {

            width: 300,

            height: 100

        };

    }


    /*
       QR / Data Matrix
    */

    return {

        width: 250,

        height: 250

    };

}


/* ==================================================
   상태
================================================== */

function setStatus(message) {

    document
        .getElementById("status")
        .textContent = message;

}


/* ==================================================
   디버그
================================================== */

function setDebug(message) {

    document
        .getElementById("debug")
        .textContent = message;

}


/* ==================================================
   CODE 128 검증값 초기화
================================================== */

function resetCode128Validation() {

    code128Candidate = "";

    code128Count = 0;

    code128LastTime = 0;

}


/* ==================================================
   바코드 종류 변경
================================================== */

document
    .getElementById("formatSelect")
    .addEventListener(
        "change",
        function() {


            if (inspectionRunning) {

                return;

            }


            resetCode128Validation();


            const name =
                getFormatName();


            setStatus(
                "🔵 " +
                name +
                " 선택됨. 검사를 시작하세요."
            );


            setDebug(
                "선택 형식: " +
                name
            );

        }
    );


/* ==================================================
   검사 시작
================================================== */

async function startInspection() {


    if (inspectionRunning) {

        return;

    }


    inspectionRunning = true;

    inspectionStopped = false;

    currentTarget = "A";

    processing = false;

    waitingForB = false;


    resetCode128Validation();


    document
        .getElementById("barcodeA")
        .value = "";


    document
        .getElementById("barcodeB")
        .value = "";


    document
        .getElementById("result")
        .textContent = "";


    document
        .getElementById("result")
        .className = "";


    document
        .getElementById("formatSelect")
        .disabled = true;


    document
        .getElementById("startBtn")
        .disabled = true;


    const formatName =
        getFormatName();


    const scanArea =
        getScanArea();


    setStatus(
        "🟡 A 바코드를 스캔하세요."
    );


    setDebug(
        formatName +
        " / 인식영역 " +
        scanArea.width +
        " × " +
        scanArea.height +
        " / 카메라 시작 중..."
    );


    scanner =
        new Html5Qrcode("reader");


    try {


        /*
           ==========================================
           카메라 시작
           ==========================================
        */

        await scanner.start(

            {
                facingMode: "environment"
            },


            {

                fps: 20,

                qrbox: scanArea,

                formatsToSupport: [

                    getSelectedFormat()

                ]

            },


            onScanSuccess,

            onScanFailure

        );


        setDebug(
            formatName +
            " / 인식영역 " +
            scanArea.width +
            " × " +
            scanArea.height +
            " / 카메라 작동 중"
        );


        /*
           자동초점
        */

        startFocusOptimization();


    } catch (error) {


        console.error(
            "카메라 시작 오류:",
            error
        );


        inspectionRunning = false;


        document
            .getElementById("formatSelect")
            .disabled = false;


        document
            .getElementById("startBtn")
            .disabled = false;


        setStatus(
            "❌ 카메라를 시작할 수 없습니다."
        );


        setDebug(
            "카메라 오류: " +
            error.name +
            " / " +
            error.message
        );

    }

}


/* ==================================================
   초점 최적화
================================================== */

function startFocusOptimization() {


    applyBestFocus();


    setTimeout(
        function() {

            applyBestFocus();

        },
        300
    );


    setTimeout(
        function() {

            applyBestFocus();

        },
        800
    );


    setTimeout(
        function() {

            applyBestFocus();

        },
        1500
    );

}


/* ==================================================
   자동초점
================================================== */

async function applyBestFocus() {


    try {


        const video =
            document.querySelector(
                "#reader video"
            );


        if (!video || !video.srcObject) {

            return;

        }


        const tracks =
            video.srcObject.getVideoTracks();


        if (
            !tracks ||
            tracks.length === 0
        ) {

            return;

        }


        const track =
            tracks[0];


        if (!track.getCapabilities) {

            return;

        }


        const capabilities =
            track.getCapabilities();


        /*
           연속 자동초점
        */

        if (
            capabilities.focusMode &&
            capabilities.focusMode.includes(
                "continuous"
            )
        ) {


            try {


                await track.applyConstraints({

                    advanced: [

                        {
                            focusMode:
                                "continuous"
                        }

                    ]

                });


                return;


            } catch (error) {

                console.log(
                    "continuous focus 실패:",
                    error
                );

            }

        }


        /*
           single-shot
        */

        if (
            capabilities.focusMode &&
            capabilities.focusMode.includes(
                "single-shot"
            )
        ) {


            try {


                await track.applyConstraints({

                    advanced: [

                        {
                            focusMode:
                                "single-shot"
                        }

                    ]

                });


                return;


            } catch (error) {

                console.log(
                    "single-shot focus 실패:",
                    error
                );

            }

        }


    } catch (error) {


        console.log(
            "초점 설정 오류:",
            error
        );

    }

}


/* ==================================================
   바코드 인식 성공
================================================== */

function onScanSuccess(
    decodedText,
    decodedResult
) {


    if (!inspectionRunning) {

        return;

    }


    if (inspectionStopped) {

        return;

    }


    if (waitingForB) {

        return;

    }


    if (processing) {

        return;

    }


    const barcode =
        decodedText.trim();


    /*
       ==========================================
       CODE 128 특별 처리
       ==========================================
    */

    const format =
        document.getElementById("formatSelect").value;


    if (format === "CODE_128") {


        const verified =
            verifyCode128(barcode);


        /*
           아직 확정되지 않은 값
        */

        if (!verified) {

            return;

        }


        /*
           검증 완료된 값
        */

        processBarcode(verified);

        return;

    }


    /*
       ==========================================
       CODE 39 / QR / Data Matrix
       ==========================================
    */

    processBarcode(barcode);

}


/* ==================================================
   CODE 128 연속값 검증
================================================== */

function verifyCode128(barcode) {


    const now =
        Date.now();


    /*
       처음 들어온 값
    */

    if (code128Candidate === "") {


        code128Candidate =
            barcode;


        code128Count = 1;

        code128LastTime = now;


        setDebug(
            "CODE 128 후보: " +
            barcode +
            " / 1/" +
            CODE128_REQUIRED_COUNT
        );


        return null;

    }


    /*
       같은 값인지 확인
    */

    if (
        barcode === code128Candidate &&
        (now - code128LastTime) <= CODE128_MAX_INTERVAL
    ) {


        code128Count++;

        code128LastTime = now;


        setDebug(
            "CODE 128 후보: " +
            barcode +
            " / " +
            code128Count +
            "/" +
            CODE128_REQUIRED_COUNT
        );


        /*
           3회 연속 동일하면 확정
        */

        if (
            code128Count >=
            CODE128_REQUIRED_COUNT
        ) {


            const verified =
                code128Candidate;


            resetCode128Validation();


            setDebug(
                "CODE 128 확정: " +
                verified
            );


            return verified;

        }


        return null;

    }


    /*
       다른 값이 들어온 경우
       새로운 후보로 교체
    */

    code128Candidate =
        barcode;


    code128Count = 1;

    code128LastTime = now;


    setDebug(
        "CODE 128 후보 변경: " +
        barcode +
        " / 1/" +
        CODE128_REQUIRED_COUNT
    );


    return null;

}


/* ==================================================
   실제 바코드 처리
================================================== */

function processBarcode(barcode) {


    if (!inspectionRunning) {

        return;

    }


    if (inspectionStopped) {

        return;

    }


    if (waitingForB) {

        return;

    }


    if (processing) {

        return;

    }


    processing = true;


    setDebug(
        getFormatName() +
        " / 최종 인식: " +
        barcode
    );


    /* ==========================================
       A
    ========================================== */

    if (currentTarget === "A") {


        document
            .getElementById("barcodeA")
            .value = barcode;


        setStatus(
            "✅ A 완료"
        );


        currentTarget = "B";


        waitingForB = true;


        setDebug(
            getFormatName() +
            " / A 인식 완료 / 2초 후 B 스캔"
        );


        setTimeout(
            function() {


                if (
                    !inspectionRunning ||
                    inspectionStopped
                ) {

                    return;

                }


                waitingForB = false;

                processing = false;


                resetCode128Validation();


                setStatus(
                    "🟡 B 바코드를 스캔하세요."
                );


                setDebug(
                    getFormatName() +
                    " / B 바코드 스캔 대기"
                );


            },
            2000
        );

    }


    /* ==========================================
       B
    ========================================== */

    else if (currentTarget === "B") {


        document
            .getElementById("barcodeB")
            .value = barcode;


        setStatus(
            "✅ B 완료"
        );


        setDebug(
            getFormatName() +
            " / A와 B 비교 중..."
        );


        setTimeout(
            function() {

                compareBarcode();

            },
            200
        );

    }

}


/* ==================================================
   스캔 실패
================================================== */

function onScanFailure(error) {

}


/* ==================================================
   비교
================================================== */

function compareBarcode() {


    const a =
        document
            .getElementById("barcodeA")
            .value;


    const b =
        document
            .getElementById("barcodeB")
            .value;


    if (a === b) {


        document
            .getElementById("result")
            .textContent =
                "✓ 일치";


        document
            .getElementById("result")
            .className =
                "match";


        setStatus(
            "🟢 일치"
        );


        setDebug(
            "A와 B가 일치합니다. " +
            "1초 후 다음 검사."
        );


        setTimeout(
            function() {

                nextInspection();

            },
            1000
        );


    } else {


        inspectionStopped = true;

        inspectionRunning = false;

        processing = true;


        document
            .getElementById("result")
            .textContent =
                "✕ 불일치";


        document
            .getElementById("result")
            .className =
                "different";


        setStatus(
            "🔴 불일치 - 검사 중지"
        );


        setDebug(
            "A: " +
            a +
            " / B: " +
            b +
            " / 초기화 버튼을 눌러주세요."
        );

    }

}


/* ==================================================
   다음 검사
================================================== */

function nextInspection() {


    if (inspectionStopped) {

        return;

    }


    document
        .getElementById("barcodeA")
        .value = "";


    document
        .getElementById("barcodeB")
        .value = "";


    document
        .getElementById("result")
        .textContent = "";


    document
        .getElementById("result")
        .className = "";


    currentTarget = "A";

    processing = false;

    waitingForB = false;

    inspectionRunning = true;


    resetCode128Validation();


    setStatus(
        "🟡 A 바코드를 스캔하세요."
    );


    setDebug(
        getFormatName() +
        " / 다음 A 바코드 대기"
    );

}


/* ==================================================
   초기화
================================================== */

async function resetAll() {


    inspectionRunning = false;

    inspectionStopped = false;

    processing = false;

    waitingForB = false;

    currentTarget = "A";


    resetCode128Validation();


    if (scanner) {


        try {

            await scanner.stop();

        } catch (error) {

            console.log(
                "카메라 정지 오류:",
                error
            );

        }


        try {

            scanner.clear();

        } catch (error) {

            console.log(
                "스캐너 clear 오류:",
                error
            );

        }


        scanner = null;

    }


    document
        .getElementById("barcodeA")
        .value = "";


    document
        .getElementById("barcodeB")
        .value = "";


    document
        .getElementById("result")
        .textContent = "";


    document
        .getElementById("result")
        .className = "";


    document
        .getElementById("formatSelect")
        .disabled = false;


    document
        .getElementById("startBtn")
        .disabled = false;


    setStatus(
        "🔵 검사할 바코드 종류를 선택하고 검사를 시작하세요."
    );


    setDebug(
        "대기 중"
    );

}

</script>

</body>

</html>
