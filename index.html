
<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>바코드 검사</title>


<style>

/* ==================================================
   기본
================================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    padding: 15px;

    font-family: Arial, sans-serif;

    background: #f5f5f5;

    text-align: center;

}


.container {

    max-width: 600px;

    margin: 0 auto;

    background: white;

    padding: 18px;

    border-radius: 15px;

    box-shadow:
        0 3px 10px rgba(0,0,0,0.1);

}


h1 {

    margin: 5px 0 20px;

    font-size: 25px;

}


/* ==================================================
   바코드 종류
================================================== */

.format-area {

    margin-bottom: 15px;

    text-align: left;

}


.format-label {

    display: block;

    margin-bottom: 7px;

    font-size: 16px;

    font-weight: bold;

}


#formatSelect {

    width: 100%;

    height: 48px;

    padding: 5px 10px;

    font-size: 17px;

    border: 1px solid #bbb;

    border-radius: 8px;

    background: white;

}


/* ==================================================
   A / B
================================================== */

.row {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 10px;

}


.label {

    width: 35px;

    font-size: 18px;

    font-weight: bold;

}


input {

    flex: 1;

    height: 45px;

    padding: 8px 12px;

    font-size: 17px;

    border: 1px solid #ccc;

    border-radius: 8px;

    background: #f8f8f8;

}


/* ==================================================
   상태
================================================== */

#status {

    margin: 15px 0;

    padding: 12px;

    border-radius: 8px;

    background: #eeeeee;

    font-size: 17px;

    font-weight: bold;

}


/* ==================================================
   카메라
================================================== */

#reader {

    width: 100%;

    margin: 15px auto;

    overflow: hidden;

    border-radius: 10px;

    background: #000;

}


#reader video {

    width: 100% !important;

    height: auto !important;

    display: block;

}


/* ==================================================
   CODE 128 전용 카메라
================================================== */

#zxingCamera {

    width: 100%;

    display: none;

    background: #000;

    border-radius: 10px;

    overflow: hidden;

}


#zxingVideo {

    width: 100%;

    height: auto;

    display: block;

    background: #000;

}


/* ==================================================
   인식 영역
================================================== */

.scan-overlay {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 300px;

    height: 100px;

    border:
        3px solid #00ff66;

    border-radius: 8px;

    pointer-events: none;

}


.zxing-camera-container {

    position: relative;

}


/* ==================================================
   결과
================================================== */

#result {

    margin: 15px 0;

    padding: 18px;

    min-height: 65px;

    border-radius: 10px;

    font-size: 28px;

    font-weight: bold;

}


.match {

    background: #d4edda;

    color: #155724;

}


.different {

    background: #f8d7da;

    color: #721c24;

}


/* ==================================================
   버튼
================================================== */

.button-area {

    display: flex;

    gap: 8px;

}


button {

    flex: 1;

    height: 50px;

    border: none;

    border-radius: 8px;

    font-size: 17px;

    font-weight: bold;

}


#startBtn {

    background: #007bff;

    color: white;

}


#resetBtn {

    background: #6c757d;

    color: white;

}


button:disabled {

    opacity: 0.5;

}


/* ==================================================
   안내
================================================== */

.guide-text {

    margin-top: 8px;

    color: #666;

    font-size: 13px;

}


/* ==================================================
   디버그
================================================== */

#debug {

    margin-top: 15px;

    padding: 10px;

    background: #f0f0f0;

    color: #555;

    font-size: 12px;

    text-align: left;

    border-radius: 8px;

    word-break: break-all;

}

</style>


<!-- ==================================================
     기존 html5-qrcode
================================================== -->

<script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
</script>


<!-- ==================================================
     CODE 128 전용 ZXing
================================================== -->

<script
    src="https://unpkg.com/@zxing/browser@latest">
</script>


</head>


<body>


<div class="container">


<h1>📦 바코드 검사</h1>


<!-- ==================================================
     바코드 종류
================================================== -->

<div class="format-area">


    <label
        class="format-label">

        바코드 종류

    </label>


    <select
        id="formatSelect">


        <option value="CODE_39">

            CODE 39

        </option>


        <option value="CODE_128">

            CODE 128

        </option>


        <option value="QR_CODE">

            QR CODE

        </option>


        <option value="DATA_MATRIX">

            Data Matrix

        </option>


    </select>


</div>


<!-- ==================================================
     A
================================================== -->

<div class="row">


    <div class="label">

        A

    </div>


    <input
        type="text"
        id="barcodeA"
        readonly>


</div>


<!-- ==================================================
     B
================================================== -->

<div class="row">


    <div class="label">

        B

    </div>


    <input
        type="text"
        id="barcodeB"
        readonly>


</div>


<!-- ==================================================
     상태
================================================== -->

<div id="status">

    🔵 검사할 바코드 종류를 선택하고 검사를 시작하세요.

</div>


<!-- ==================================================
     기존 카메라
================================================== -->

<div id="reader"></div>


<!-- ==================================================
     CODE 128 카메라
================================================== -->

<div
    id="zxingCamera"
    class="zxing-camera-container">


    <video
        id="zxingVideo"
        playsinline
        muted>
    </video>


    <div
        class="scan-overlay">
    </div>


</div>


<div class="guide-text">

    초록색 인식 영역 안에 바코드를 맞춰주세요.

</div>


<!-- ==================================================
     결과
================================================== -->

<div id="result"></div>


<!-- ==================================================
     버튼
================================================== -->

<div class="button-area">


    <button
        id="startBtn"
        onclick="startInspection()">

        검사 시작

    </button>


    <button
        id="resetBtn"
        onclick="resetAll()">

        초기화

    </button>


</div>


<!-- ==================================================
     디버그
================================================== -->

<div id="debug">

    대기 중

</div>


</div>


<script>


/* ==================================================
   전역 변수
================================================== */


/*
   기존 html5-qrcode
*/

let scanner = null;


/*
   CODE 128 ZXing
*/

let zxingReader = null;

let zxingControls = null;


/*
   검사 상태
*/

let currentTarget = "A";

let processing = false;

let inspectionRunning = false;

let inspectionStopped = false;

let waitingForB = false;


/*
   CODE 128 검증
*/

let code128Candidate = "";

let code128Count = 0;

let code128LastTime = 0;


/*
   CODE 128 동일값 확인 횟수
*/

const CODE128_REQUIRED_COUNT = 3;


/*
   연속 인식 허용 시간
*/

const CODE128_MAX_INTERVAL = 1000;


/* ==================================================
   상태 표시
================================================== */

function setStatus(message) {

    document
        .getElementById("status")
        .textContent = message;

}


/* ==================================================
   디버그 표시
================================================== */

function setDebug(message) {

    document
        .getElementById("debug")
        .textContent = message;

}


/* ==================================================
   현재 형식 이름
================================================== */

function getFormatName() {


    const format =
        document
            .getElementById("formatSelect")
            .value;


    if (format === "CODE_39") {

        return "CODE 39";

    }


    if (format === "CODE_128") {

        return "CODE 128";

    }


    if (format === "QR_CODE") {

        return "QR CODE";

    }


    if (format === "DATA_MATRIX") {

        return "Data Matrix";

    }


    return format;

}


/* ==================================================
   html5-qrcode 형식
================================================== */

function getSelectedFormat() {


    const format =
        document
            .getElementById("formatSelect")
            .value;


    if (format === "CODE_39") {

        return Html5QrcodeSupportedFormats.CODE_39;

    }


    if (format === "QR_CODE") {

        return Html5QrcodeSupportedFormats.QR_CODE;

    }


    if (format === "DATA_MATRIX") {

        return Html5QrcodeSupportedFormats.DATA_MATRIX;

    }


    return Html5QrcodeSupportedFormats.CODE_39;

}


/* ==================================================
   인식 영역
================================================== */

function getScanArea() {


    const format =
        document
            .getElementById("formatSelect")
            .value;


    if (
        format === "CODE_39" ||
        format === "CODE_128"
    ) {


        return {

            width: 300,

            height: 100

        };

    }


    return {

        width: 250,

        height: 250

    };

}


/* ==================================================
   CODE 128 검증 초기화
================================================== */

function resetCode128Validation() {


    code128Candidate = "";

    code128Count = 0;

    code128LastTime = 0;

}


/* ==================================================
   형식 변경
================================================== */

document
    .getElementById("formatSelect")
    .addEventListener(
        "change",
        function() {


            if (inspectionRunning) {

                return;

            }


            resetCode128Validation();


            const name =
                getFormatName();


            setStatus(
                "🔵 " +
                name +
                " 선택됨. 검사를 시작하세요."
            );


            setDebug(
                "선택 형식: " +
                name
            );

        }
    );


/* ==================================================
   검사 시작
================================================== */

async function startInspection() {


    if (inspectionRunning) {

        return;

    }


    inspectionRunning = true;

    inspectionStopped = false;

    currentTarget = "A";

    processing = false;

    waitingForB = false;


    resetCode128Validation();


    document
        .getElementById("barcodeA")
        .value = "";


    document
        .getElementById("barcodeB")
        .value = "";


    document
        .getElementById("result")
        .textContent = "";


    document
        .getElementById("result")
        .className = "";


    document
        .getElementById("formatSelect")
        .disabled = true;


    document
        .getElementById("startBtn")
        .disabled = true;


    const format =
        document
            .getElementById("formatSelect")
            .value;


    setStatus(
        "🟡 A 바코드를 스캔하세요."
    );


    /*
       CODE 128
    */

    if (format === "CODE_128") {


        await startCode128Scanner();


        return;

    }


    /*
       나머지 형식
    */

    await startHtml5Scanner();

}


/* ==================================================
   기존 html5-qrcode 시작
================================================== */

async function startHtml5Scanner() {


    const formatName =
        getFormatName();


    const scanArea =
        getScanArea();


    document
        .getElementById("reader")
        .style.display = "block";


    document
        .getElementById("zxingCamera")
        .style.display = "none";


    setDebug(
        formatName +
        " / 인식영역 " +
        scanArea.width +
        " × " +
        scanArea.height +
        " / 카메라 시작 중..."
    );


    scanner =
        new Html5Qrcode("reader");


    try {


        await scanner.start(

            {
                facingMode: "environment"
            },


            {

                fps: 20,

                qrbox: scanArea,

                formatsToSupport: [

                    getSelectedFormat()

                ]

            },


            onHtml5ScanSuccess,

            onScanFailure

        );


        setDebug(
            formatName +
            " / 카메라 작동 중"
        );


        startFocusOptimization();


    } catch (error) {


        console.error(
            error
        );


        inspectionRunning = false;


        document
            .getElementById("formatSelect")
            .disabled = false;


        document
            .getElementById("startBtn")
            .disabled = false;


        setStatus(
            "❌ 카메라를 시작할 수 없습니다."
        );


        setDebug(
            "카메라 오류: " +
            error.name +
            " / " +
            error.message
        );

    }

}


/* ==================================================
   CODE 128 ZXing 시작
================================================== */

async function startCode128Scanner() {


    document
        .getElementById("reader")
        .style.display = "none";


    document
        .getElementById("zxingCamera")
        .style.display = "block";


    setDebug(
        "CODE 128 / ZXing 디코더 준비 중..."
    );


    try {


        /*
           ZXing 객체 확인
        */

        if (
            typeof ZXing === "undefined"
        ) {


            throw new Error(
                "ZXing 라이브러리를 불러오지 못했습니다."
            );

        }


        /*
           CODE 128만 지정
        */

        const hints =
            new Map();


        hints.set(
            ZXing.DecodeHintType.POSSIBLE_FORMATS,
            [
                ZXing.BarcodeFormat.CODE_128
            ]
        );


        /*
           ZXing BrowserMultiFormatReader
        */

        zxingReader =
            new ZXing.BrowserMultiFormatReader(
                hints,
                200
            );


        const video =
            document
                .getElementById("zxingVideo");


        /*
           후면 카메라
        */

        zxingControls =
            await zxingReader.decodeFromConstraints(

                {

                    video: {

                        facingMode:
                            "environment"

                    }

                },

                video,

                function(
                    result,
                    error,
                    controls
                ) {


                    if (!inspectionRunning) {

                        return;

                    }


                    if (inspectionStopped) {

                        return;

                    }


                    if (!result) {

                        return;

                    }


                    /*
                       결과 텍스트
                    */

                    const text =
                        result.getText();


                    /*
                       CODE 128 결과만 처리
                    */

                    processCode128Result(
                        text
                    );

                }

            );


        /*
           초점 개선
        */

        startZXingFocusOptimization();


        setDebug(
            "CODE 128 / ZXing 카메라 작동 중"
        );


    } catch (error) {


        console.error(
            "ZXing 카메라 오류:",
            error
        );


        inspectionRunning = false;


        document
            .getElementById("formatSelect")
            .disabled = false;


        document
            .getElementById("startBtn")
            .disabled = false;


        setStatus(
            "❌ CODE 128 카메라를 시작할 수 없습니다."
        );


        setDebug(
            "ZXing 오류: " +
            error.name +
            " / " +
            error.message
        );

    }

}


/* ==================================================
   CODE 128 결과
================================================== */

function processCode128Result(text) {


    if (!text) {

        return;

    }


    const barcode =
        String(text).trim();


    /*
       같은 값을 여러 번 확인
    */

    const verified =
        verifyCode128(barcode);


    if (!verified) {

        return;

    }


    /*
       최종 처리
    */

    processBarcode(
        verified
    );

}


/* ==================================================
   CODE 128 연속값 검증
================================================== */

function verifyCode128(barcode) {


    const now =
        Date.now();


    /*
       첫 번째 값
    */

    if (
        code128Candidate === ""
    ) {


        code128Candidate =
            barcode;


        code128Count = 1;

        code128LastTime = now;


        setDebug(
            "CODE 128 후보: " +
            barcode +
            " / 1/" +
            CODE128_REQUIRED_COUNT
        );


        return null;

    }


    /*
       같은 값
    */

    if (
        barcode === code128Candidate &&
        (
            now -
            code128LastTime
        ) <= CODE128_MAX_INTERVAL
    ) {


        code128Count++;

        code128LastTime = now;


        setDebug(
            "CODE 128 후보: " +
            barcode +
            " / " +
            code128Count +
            "/" +
            CODE128_REQUIRED_COUNT
        );


        if (
            code128Count >=
            CODE128_REQUIRED_COUNT
        ) {


            const result =
                code128Candidate;


            resetCode128Validation();


            setDebug(
                "CODE 128 확정: " +
                result
            );


            return result;

        }


        return null;

    }


    /*
       다른 값이면
       새로운 후보로 교체
    */

    code128Candidate =
        barcode;


    code128Count = 1;

    code128LastTime = now;


    setDebug(
        "CODE 128 후보 변경: " +
        barcode +
        " / 1/" +
        CODE128_REQUIRED_COUNT
    );


    return null;

}


/* ==================================================
   html5-qrcode 인식 성공
================================================== */

function onHtml5ScanSuccess(
    decodedText,
    decodedResult
) {


    if (!inspectionRunning) {

        return;

    }


    if (inspectionStopped) {

        return;

    }


    if (waitingForB) {

        return;

    }


    if (processing) {

        return;

    }


    const barcode =
        String(decodedText).trim();


    processBarcode(
        barcode
    );

}


/* ==================================================
   실제 바코드 처리
================================================== */

function processBarcode(barcode) {


    if (!inspectionRunning) {

        return;

    }


    if (inspectionStopped) {

        return;

    }


    if (waitingForB) {

        return;

    }


    if (processing) {

        return;

    }


    processing = true;


    setDebug(
        getFormatName() +
        " / 최종 인식: " +
        barcode
    );


    /*
       ==========================================
       A
       ==========================================
    */

    if (
        currentTarget === "A"
    ) {


        document
            .getElementById("barcodeA")
            .value = barcode;


        setStatus(
            "✅ A 완료"
        );


        currentTarget = "B";


        waitingForB = true;


        setDebug(
            getFormatName() +
            " / A 인식 완료 / 2초 후 B 스캔"
        );


        setTimeout(
            function() {


                if (
                    !inspectionRunning ||
                    inspectionStopped
                ) {

                    return;

                }


                waitingForB = false;

                processing = false;


                resetCode128Validation();


                setStatus(
                    "🟡 B 바코드를 스캔하세요."
                );


                setDebug(
                    getFormatName() +
                    " / B 바코드 스캔 대기"
                );


            },
            2000
        );

    }


    /*
       ==========================================
       B
       ==========================================
    */

    else {


        document
            .getElementById("barcodeB")
            .value = barcode;


        setStatus(
            "✅ B 완료"
        );


        setDebug(
            getFormatName() +
            " / A와 B 비교 중..."
        );


        setTimeout(
            function() {

                compareBarcode();

            },
            200
        );

    }

}


/* ==================================================
   스캔 실패
================================================== */

function onScanFailure(error) {

}


/* ==================================================
   A / B 비교
================================================== */

function compareBarcode() {


    const a =
        document
            .getElementById("barcodeA")
            .value;


    const b =
        document
            .getElementById("barcodeB")
            .value;


    if (
        a === b
    ) {


        document
            .getElementById("result")
            .textContent =
                "✓ 일치";


        document
            .getElementById("result")
            .className =
                "match";


        setStatus(
            "🟢 일치"
        );


        setDebug(
            "A와 B가 일치합니다. " +
            "1초 후 다음 검사."
        );


        setTimeout(
            function() {

                nextInspection();

            },
            1000
        );


    } else {


        inspectionStopped = true;

        inspectionRunning = false;

        processing = true;


        document
            .getElementById("result")
            .textContent =
                "✕ 불일치";


        document
            .getElementById("result")
            .className =
                "different";


        setStatus(
            "🔴 불일치 - 검사 중지"
        );


        setDebug(
            "A: " +
            a +
            " / B: " +
            b +
            " / 초기화 버튼을 눌러주세요."
        );

    }

}


/* ==================================================
   다음 검사
================================================== */

function nextInspection() {


    if (inspectionStopped) {

        return;

    }


    document
        .getElementById("barcodeA")
        .value = "";


    document
        .getElementById("barcodeB")
        .value = "";


    document
        .getElementById("result")
        .textContent = "";


    document
        .getElementById("result")
        .className = "";


    currentTarget = "A";

    processing = false;

    waitingForB = false;

    inspectionRunning = true;


    resetCode128Validation();


    setStatus(
        "🟡 A 바코드를 스캔하세요."
    );


    setDebug(
        getFormatName() +
        " / 다음 A 바코드 대기"
    );

}


/* ==================================================
   ZXing 초점 최적화
================================================== */

function startZXingFocusOptimization() {


    setTimeout(
        applyZXingFocus,
        300
    );


    setTimeout(
        applyZXingFocus,
        800
    );


    setTimeout(
        applyZXingFocus,
        1500
    );

}


/* ==================================================
   ZXing 초점 적용
================================================== */

async function applyZXingFocus() {


    try {


        const video =
            document
                .getElementById("zxingVideo");


        if (
